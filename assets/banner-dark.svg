<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Rafael Brandão, biólogo e desenvolvedor">
<style>
  .rung,.top,.bot{animation-duration:3.2s;animation-iteration-count:infinite;animation-direction:alternate;animation-timing-function:ease-in-out;transform-box:fill-box}
  .rung{stroke-width:2.2;stroke-linecap:round;opacity:.55;transform-origin:center;animation-name:flip}
  .top{animation-name:up} .bot{animation-name:down}
  @keyframes flip{from{transform:scaleY(1)}to{transform:scaleY(-1)}}
  @keyframes up{from{transform:translateY(-62px)}to{transform:translateY(62px)}}
  @keyframes down{from{transform:translateY(62px)}to{transform:translateY(-62px)}}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
